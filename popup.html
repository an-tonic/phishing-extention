<!DOCTYPE html>
<html lang="en">
<head>
  <title>Phishing Detector</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
      padding: 16px;
      width: 300px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #0077cc;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h1>Phishing Detector</h1>
<p>Protect yourself from malicious links.</p>
<label>
  <input type="checkbox" id="exclude-toggle">
  Exclude this site
</label>

<hr>
<a href="https://github.com/an-tonic/phishing-extention.git" target="_blank">View on GitHub</a>

<script src="popup.js"></script>
</body>
</html>
